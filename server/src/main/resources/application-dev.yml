spring:
  jpa:
    show-sql: true
  flyway:
    locations: classpath:db/migration, classpath:db/testdata
  datasource:
    username: postgres
    password: admin
    url: jdbc:postgresql://localhost:5432/gymniac

authentication:
  token:
    jwt:
      private-key: classpath:private.pem
      public-key: classpath:public.pem

client:
  domain: localhost
  oauth2RedirectAfter: http://localhost:3000/login/google/success

storage:
  current-provider: LOCAL
  multipart-max-file-size: ${spring.servlet.multipart.max-file-size}
  local:
    directory: C:\\Users\\bob\\Pictures\\gymniac
  r2:
    endpoint: ${R2_ENDPOINT}
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}
    bucket: ${R2_BUCKET}